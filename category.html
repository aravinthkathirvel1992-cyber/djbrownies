<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-4">

<!-- Back Button -->
<button onclick="history.back()" class="mb-4 bg-black text-white px-4 py-2 rounded">
  ← Back
</button>

<h1 id="title" class="text-3xl font-bold mb-6"></h1>

<div id="items" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
<!-- CART DISPLAY -->
<div id="cart" class="mt-6 bg-white p-4 rounded shadow"></div>
<h3 class="font-bold mt-2">Total: ₹<span id="total">0</span></h3>

<!-- Cart -->
<!-- Customer Details Form -->
<!-- Customer Details Form -->
<div class="mt-4">
  <label for="customerName" class="block font-medium mb-1">👤 Name</label>
  <input type="text" id="customerName" placeholder="Enter your name" class="w-full border p-2 rounded mb-2">

  <label for="customerMobile" class="block font-medium mb-1">📱 Mobile Number</label>
  <input type="tel" id="customerMobile" placeholder="Enter your mobile number" class="w-full border p-2 rounded mb-2">

  <label for="customerAddress" class="block font-medium mb-1">🏠 Delivery Address</label>
  <textarea id="customerAddress" placeholder="Enter full delivery address" class="w-full border p-2 rounded mb-2" rows="3"></textarea>

  <!-- WhatsApp Order Button -->
  <button onclick="sendWhatsApp()" class="mt-4 w-full bg-green-500 text-white py-2 rounded-xl font-bold hover:bg-green-600">
    Order on WhatsApp
  </button>
</div>

<script>
// WhatsApp Number
const phone = "917502382224";
function sendWhatsApp() {
  const name = document.getElementById("customerName").value.trim();
  const mobile = document.getElementById("customerMobile").value.trim();
  const address = document.getElementById("customerAddress").value.trim();

  if (!name || !mobile || !address) {
    alert("Please fill in Name, Mobile Number, and Delivery Address!");
    return;
  }

  let message = "*DJ Brownies Order*\n";
  message += "👤 Name: " + name + "\n";
  message += "📱 Mobile: " + mobile + "\n";
  message += "🏠 Address: " + address + "\n\n";

  let total = 0;
  let hasItems = false;

  // Loop through cart keys safely using menuData[category]
  Object.keys(cart).forEach(key => {
    const index = parseInt(key);
    const qty = parseInt(cart[key]);
    if (qty > 0 && menuData[category][index]) {
      const item = menuData[category][index];
      const cost = qty * item.price;
      total += cost;
      message += `${item.name} x ${qty} = ₹${cost}\n`;
      hasItems = true;
    }
  });

  if (!hasItems) {
    message += "(No items added)\n";
  }

  message += "\nTotal: ₹" + total;

  const encodedMessage = encodeURIComponent(message);
  const url = `https://wa.me/${phone}?text=${encodedMessage}`;
  window.location.href = url;
}
// Get category from URL
const params = new URLSearchParams(window.location.search);
const category = params.get("cat");
document.getElementById("title").innerText = category;

// Full Menu Data

  ]
};

// CART
const cart = {};

// Render items
const itemsDiv = document.getElementById("items");

menuData[category].forEach((item, index) => {
  itemsDiv.innerHTML += `
    <div class="bg-white rounded-2xl shadow overflow-hidden hover:scale-105 transition">
      <img src="${item.img}" class="w-full h-40 object-cover">
      <div class="p-4 flex flex-col justify-between">
        <h3 class="font-semibold text-lg mb-1">${item.name}</h3>
        <p class="text-yellow-600 font-bold mb-2">₹${item.price}</p>
        <input type="number" min="0" value="0"
          onchange="updateCart(${index}, this.value)"
          class="border w-16 p-1 rounded">
      </div>
    </div>
  `;
});

// Update cart
function updateCart(index, qty){
  qty = parseInt(qty);
  if(qty>0) cart[index] = qty; else delete cart[index];
  renderCart();
}

// Render cart
function renderCart(){
  let total=0;
  const cartDiv = document.getElementById("cart");
  cartDiv.innerHTML="";
  for(let i in cart){
    const item = menuData[category][i];
    const qty = cart[i];
    const cost = qty * item.price;
    total += cost;
    cartDiv.innerHTML += `<div>${item.name} x ${qty} = ₹${cost}</div>`;
  }
  document.getElementById("total").innerText = total;
}

 // Make sure this is your number in international format, no '+'

</script>

</body>
</html>
